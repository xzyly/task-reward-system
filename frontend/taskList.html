<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务大厅 - TaskHub</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/common.css" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar" id="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-brand">
                <i class="fas fa-briefcase"></i>
                TaskHub
            </a>
            <ul class="navbar-nav">
                <li><a href="index.html" class="nav-link">首页</a></li>
                <li><a href="taskList.html" class="nav-link active">任务大厅</a></li>
                <li><a href="publishTask.html" class="nav-link">发布任务</a></li>
                <!-- 好友功能下拉菜单 -->
                <li class="nav-dropdown" id="friendsDropdown" style="display: none;">
                    <a href="#" class="nav-link dropdown-toggle" data-page="friends">
                        <i class="fas fa-users"></i> 好友
                        <span id="friendRequestBadge" class="notification-badge" style="display: none;"></span>
                        <i class="fas fa-chevron-down dropdown-arrow"></i>
                    </a>
                    <div class="dropdown-content" id="friendsDropdownContent">
                        <!-- 搜索用户 -->
                        <div class="dropdown-section">
                            <div class="dropdown-header">
                                <i class="fas fa-search"></i> 搜索用户
                            </div>
                            <div class="search-container">
                                <input type="text" id="navSearchInput" class="dropdown-search-input" placeholder="输入用户名...">
                                <button id="navSearchBtn" class="dropdown-search-btn">
                                    <i class="fas fa-search"></i>
                                </button>
                            </div>
                            <div id="navSearchResults" class="search-results-container"></div>
                        </div>
                        
                        <!-- 好友申请 -->
                        <div class="dropdown-section">
                            <div class="dropdown-header">
                                <i class="fas fa-user-plus"></i> 好友申请
                                <span id="requestCountBadge" class="count-badge" style="display: none;"></span>
                            </div>
                            <div id="navFriendRequests" class="friend-requests-container">
                                <div class="empty-message">暂无好友申请</div>
                            </div>
                        </div>
                        
                        <!-- 我的好友 -->
                        <div class="dropdown-section">
                            <div class="dropdown-header">
                                <i class="fas fa-users"></i> 我的好友
                            </div>
                            <div id="navFriendsList" class="friends-list-container">
                                <div class="empty-message">暂无好友</div>
                            </div>
                        </div>
                        
                        <div class="dropdown-footer">
                            <a href="friends.html" class="dropdown-link-full">
                                <i class="fas fa-external-link-alt"></i> 查看完整好友管理
                            </a>
                        </div>
                    </div>
                </li>
                <li><a href="myself.html" class="nav-link">个人中心</a></li>
                <!-- 未登录状态 -->
                <li id="login-btn" style="display: none;"><a href="auth.html" class="nav-link btn btn-primary">登录/注册</a></li>
                <!-- 已登录状态 -->
                <li id="user-menu" class="user-menu" style="display: none;">
                    <div class="user-dropdown">
                        <button class="user-info-btn" id="userInfoBtn">
                            <i class="fas fa-user"></i>
                            <span id="username">用户名</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                        <div class="dropdown-menu" id="userDropdown">
                            <a href="myself.html" class="dropdown-item">
                                <i class="fas fa-user"></i>
                                个人中心
                            </a>
                            <a href="publishTask.html" class="dropdown-item">
                                <i class="fas fa-plus"></i>
                                发布任务
                            </a>
                            <div class="dropdown-divider"></div>
                            <button class="dropdown-item" id="logoutBtn">
                                <i class="fas fa-sign-out-alt"></i>
                                退出登录
                            </button>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main class="main-content">
        <!-- 页面标题区域 -->
        <section class="page-header">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-8">
                        <h1 class="page-title">任务大厅</h1>
                        <p class="page-subtitle">发现适合您技能的项目机会，开启您的自由职业之旅</p>
                    </div>
                    <div class="col-4 text-right">
                        <div class="task-stats">
                            <span class="stat-item">
                                <strong id="total-tasks">0</strong> 个任务
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 搜索和筛选区域 -->
        <section class="search-section">
            <div class="container">
                <div class="search-filters card">
                    <div class="card-body">
                        <!-- 搜索框 -->
                        <div class="search-bar mb-4">
                            <div class="search-input-group">
                                <i class="fas fa-search search-icon"></i>
                                <input type="text" id="searchInput" class="form-control search-input" 
                                       placeholder="搜索任务标题、描述或关键词...">
                                <button type="button" class="btn btn-primary search-btn" onclick="performSearch()">
                                    搜索
                                </button>
                            </div>
                        </div>

                        <!-- 筛选器 -->
                        <div class="filter-row">
                            <div class="filter-group">
                                <label class="filter-label">分类:</label>
                                <select id="categoryFilter" class="form-select filter-select">
                                    <option value="">全部分类</option>
                                    <option value="技术开发">技术开发</option>
                                    <option value="创意设计">创意设计</option>
                                    <option value="市场营销">市场营销</option>
                                    <option value="商务咨询">商务咨询</option>
                                    <option value="文案写作">文案写作</option>
                                    <option value="数据分析">数据分析</option>
                                    <option value="其他">其他</option>
                                </select>
                            </div>

                            <div class="filter-group">
                                <label class="filter-label">预算范围:</label>
                                <select id="budgetFilter" class="form-select filter-select">
                                    <option value="">全部预算</option>
                                    <option value="0-500">￥500以下</option>
                                    <option value="500-2000">￥500-2000</option>
                                    <option value="2000-5000">￥2000-5000</option>
                                    <option value="5000-10000">￥5000-10000</option>
                                    <option value="10000+">￥10000以上</option>
                                </select>
                            </div>

                            <div class="filter-group">
                                <label class="filter-label">状态:</label>
                                <select id="statusFilter" class="form-select filter-select">
                                    <option value="">全部状态</option>
                                    <option value="open">进行中</option>
                                    <option value="completed">已完成</option>
                                    <option value="cancelled">已取消</option>
                                </select>
                            </div>

                            <div class="filter-group">
                                <label class="filter-label">排序:</label>
                                <select id="sortFilter" class="form-select filter-select">
                                    <option value="created_at_desc">最新发布</option>
                                    <option value="budget_desc">预算从高到低</option>
                                    <option value="budget_asc">预算从低到高</option>
                                    <option value="deadline_asc">截止时间</option>
                                </select>
                            </div>

                            <div class="filter-actions">
                                <button type="button" class="btn btn-outline-primary" onclick="resetFilters()">
                                    <i class="fas fa-refresh"></i>
                                    重置
                                </button>
                                <button type="button" class="btn btn-primary" onclick="applyFilters()">
                                    <i class="fas fa-filter"></i>
                                    应用筛选
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 任务列表区域 -->
        <section class="tasks-section">
            <div class="container">
                <!-- 加载状态 -->
                <div id="loading" class="loading-state" style="display: none;">
                    <div class="loading-spinner"></div>
                    <p>正在加载任务...</p>
                </div>

                <!-- 任务列表 -->
                <div id="taskList" class="task-list">
                    <!-- 动态生成的任务卡片 -->
                </div>

                <!-- 空状态 -->
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-illustration">
                        <i class="fas fa-search"></i>
                    </div>
                    <h3>没有找到匹配的任务</h3>
                    <p>尝试调整搜索条件或筛选器，或者</p>
                    <a href="publishTask.html" class="btn btn-primary">
                        <i class="fas fa-plus"></i>
                        发布新任务
                    </a>
                </div>

                <!-- 分页 -->
                <div id="pagination" class="pagination-container">
                    <!-- 动态生成的分页组件 -->
                </div>
            </div>
        </section>
    </main>

    <!-- 自定义样式 -->
    <style>
        /* 好友下拉菜单样式 */
        .nav-dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-toggle {
            position: relative;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .notification-badge {
            position: absolute;
            top: -2px;
            right: 20px;
            background: #da3633;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .dropdown-arrow {
            font-size: 10px;
            transition: transform 0.2s ease;
        }

        .dropdown-toggle.active .dropdown-arrow {
            transform: rotate(180deg);
        }

        .dropdown-content {
            position: absolute;
            top: 100%;
            left: 0;
            background: rgba(13, 17, 23, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(240, 246, 252, 0.1);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            min-width: 350px;
            max-width: 400px;
            max-height: 500px;
            overflow-y: auto;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .dropdown-content.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-section {
            padding: 16px;
            border-bottom: 1px solid rgba(240, 246, 252, 0.1);
        }

        .dropdown-section:last-child {
            border-bottom: none;
        }

        .dropdown-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #f0f6fc;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .count-badge {
            background: #58a6ff;
            color: white;
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: bold;
            margin-left: auto;
        }

        .search-container {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .dropdown-search-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid rgba(240, 246, 252, 0.2);
            border-radius: 6px;
            background: rgba(240, 246, 252, 0.05);
            color: #f0f6fc;
            font-size: 13px;
        }

        .dropdown-search-input::placeholder {
            color: #8b949e;
        }

        .dropdown-search-input:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.1);
        }

        .dropdown-search-btn {
            padding: 8px 12px;
            background: #58a6ff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dropdown-search-btn:hover {
            background: #79c0ff;
        }

        .search-results-container,
        .friend-requests-container,
        .friends-list-container {
            max-height: 120px;
            overflow-y: auto;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(240, 246, 252, 0.05);
        }

        .user-item:last-child {
            border-bottom: none;
        }

        .user-avatar-small {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }

        .user-info-small {
            flex: 1;
            min-width: 0;
        }

        .user-name-small {
            color: #f0f6fc;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-level-small {
            color: #8b949e;
            font-size: 11px;
        }

        .user-action-small {
            display: flex;
            gap: 4px;
        }

        .action-btn-small {
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-add-small {
            background: #238636;
            color: white;
        }

        .btn-add-small:hover {
            background: #2ea043;
        }

        .btn-accept-small {
            background: #238636;
            color: white;
        }

        .btn-accept-small:hover {
            background: #2ea043;
        }

        .btn-reject-small {
            background: #da3633;
            color: white;
        }

        .btn-reject-small:hover {
            background: #c5282f;
        }

        .btn-chat-small {
            background: #58a6ff;
            color: white;
        }

        .btn-chat-small:hover {
            background: #79c0ff;
        }

        .empty-message {
            color: #8b949e;
            font-size: 12px;
            text-align: center;
            padding: 16px 0;
        }

        .status-text-small {
            font-size: 11px;
            color: #8b949e;
        }

        .dropdown-footer {
            padding: 12px 16px;
            border-top: 1px solid rgba(240, 246, 252, 0.1);
        }

        .dropdown-link-full {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #58a6ff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            padding: 8px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .dropdown-link-full:hover {
            background: rgba(88, 166, 255, 0.1);
            color: #79c0ff;
        }

        /* 用户下拉菜单样式 */
        .user-menu {
            position: relative;
        }

        .user-dropdown {
            position: relative;
        }

        .user-info-btn {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-md);
            background: transparent;
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-button);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition-normal);
            font-size: var(--font-size-sm);
        }

        .user-info-btn:hover {
            background: var(--bg-hover);
            border-color: var(--primary);
            color: var(--primary);
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: var(--spacing-sm);
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            min-width: 200px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: var(--transition-normal);
            z-index: 1000;
        }

        .dropdown-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md) var(--spacing-lg);
            color: var(--text-secondary);
            text-decoration: none;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: var(--transition-normal);
            font-size: var(--font-size-sm);
        }

        .dropdown-item:hover {
            background: var(--bg-hover);
            color: var(--primary);
        }

        .dropdown-item:first-child {
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }

        .dropdown-item:last-child {
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
        }

        .dropdown-divider {
            height: 1px;
            background: var(--border-light);
            margin: var(--spacing-xs) 0;
        }

        /* 页面标题区域 */
        .page-header {
            padding: var(--spacing-3xl) 0 var(--spacing-xl) 0;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            border-bottom: 1px solid var(--border-light);
            position: relative;
            overflow: hidden;
        }

        .page-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }

        .page-title {
            font-size: var(--font-size-3xl);
            font-weight: var(--font-weight-bold);
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
        }

        .page-subtitle {
            font-size: var(--font-size-lg);
            color: var(--text-secondary);
            margin: 0;
        }

        .task-stats {
            text-align: right;
        }

        .stat-item {
            color: var(--text-secondary);
            font-size: var(--font-size-base);
        }

        .stat-item strong {
            color: var(--primary);
            font-size: var(--font-size-lg);
        }

        /* 搜索筛选区域 */
        .search-section {
            padding: var(--spacing-xl) 0;
        }

        .search-filters {
            box-shadow: var(--shadow-sm);
        }

        .search-input-group {
            position: relative;
            display: flex;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-icon {
            position: absolute;
            left: var(--spacing-lg);
            color: var(--text-muted);
            z-index: 2;
        }

        .search-input {
            padding-left: 45px;
            border-radius: var(--radius-button) 0 0 var(--radius-button);
            border-right: none;
        }

        .search-btn {
            border-radius: 0 var(--radius-button) var(--radius-button) 0;
            white-space: nowrap;
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-lg);
            align-items: end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            min-width: 150px;
        }

        .filter-label {
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xs);
        }

        .filter-select {
            min-width: 150px;
        }

        .filter-actions {
            display: flex;
            gap: var(--spacing-sm);
            margin-left: auto;
        }

        /* 任务列表 */
        .tasks-section {
            padding: var(--spacing-xl) 0 var(--spacing-3xl) 0;
        }

        .task-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: var(--spacing-xl);
            margin-bottom: var(--spacing-2xl);
        }

        .task-card {
            transition: var(--transition-normal);
            cursor: pointer;
        }

        .task-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--spacing-md);
        }

        .task-category {
            font-size: var(--font-size-xs);
            padding: var(--spacing-xs) var(--spacing-sm);
            background: var(--primary-light);
            color: var(--primary);
            border-radius: var(--radius-full);
            font-weight: var(--font-weight-medium);
        }

        .task-status {
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--radius-full);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-medium);
        }

        .task-status.open {
            background: rgba(39, 174, 96, 0.1);
            color: var(--success);
        }

        .task-status.completed {
            background: rgba(52, 152, 219, 0.1);
            color: var(--info);
        }

        .task-status.cancelled {
            background: rgba(231, 76, 60, 0.1);
            color: var(--danger);
        }

        .task-title {
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-semibold);
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
            line-height: var(--line-height-tight);
        }

        .task-title a {
            text-decoration: none;
            color: inherit;
        }

        .task-title a:hover {
            color: var(--primary);
        }

        .task-description {
            color: var(--text-secondary);
            margin-bottom: var(--spacing-lg);
            line-height: var(--line-height-relaxed);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
        }

        .task-budget {
            font-size: var(--font-size-xl);
            font-weight: var(--font-weight-bold);
            color: var(--success);
        }

        .task-deadline {
            color: var(--text-muted);
            font-size: var(--font-size-sm);
        }

        .task-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: var(--spacing-lg);
            border-top: 1px solid var(--border-light);
        }

        .task-publisher {
            display: flex;
            align-items: center;
            color: var(--text-secondary);
            font-size: var(--font-size-sm);
        }

        .task-publisher i {
            margin-right: var(--spacing-xs);
        }

        .task-actions {
            display: flex;
            gap: var(--spacing-sm);
        }

    <script>
        // API调用函数
        async function makeRequest(endpoint, method = 'GET', body = null, auth = true) {
            const API_BASE_URL = 'http://localhost:3000/api';
            const headers = {
                'Content-Type': 'application/json'
            };

            if (auth) {
                const token = localStorage.getItem('token') || localStorage.getItem('authToken');
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }
            }

            const config = {
                method,
                headers
            };

            if (body) {
                config.body = JSON.stringify(body);
            }

            try {
                const response = await fetch(`${API_BASE_URL}${endpoint}`, config);
                if (!response.ok) {
                    let errorData;
                    try {
                        errorData = await response.json();
                    } catch (e) {
                        errorData = { error: `请求失败: ${response.status} ${response.statusText}` };
                    }
                    throw new Error(errorData.error || '请求失败');
                }

                const contentLength = response.headers.get('content-length');
                if (contentLength === '0' || !contentLength) {
                    return null;
                }

                return await response.json();
            } catch (error) {
                console.error('API请求错误:', error);
                throw error;
            }
        }
    </script>
    <script>
        let currentPage = 1;
        let currentFilters = {};
        let allTasks = [];

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 检查登录状态并更新导航栏
            updateNavbar();
            
            // 初始化好友功能
            initializeFriendsWidget();
            
            loadTasks();
            
            // 导航栏滚动效果
            window.addEventListener('scroll', function() {
                const navbar = document.getElementById('navbar');
                if (window.scrollY > 50) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }
            });

            // 搜索框回车搜索
            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });
        });

        // 更新导航栏显示
        function updateNavbar() {
            const token = localStorage.getItem('token') || localStorage.getItem('authToken');
            const userData = getUserData();
            const loginBtn = document.getElementById('login-btn');
            const userMenu = document.getElementById('user-menu');
            const usernameSpan = document.getElementById('username');

            if (token && userData) {
                // 已登录状态
                loginBtn.style.display = 'none';
                userMenu.style.display = 'block';
                usernameSpan.textContent = userData.username || '用户';
                
                // 绑定下拉菜单事件
                bindUserMenuEvents();
            } else {
                // 未登录状态
                loginBtn.style.display = 'block';
                userMenu.style.display = 'none';
            }
        }

        // 绑定用户菜单事件
        function bindUserMenuEvents() {
            const userInfoBtn = document.getElementById('userInfoBtn');
            const userDropdown = document.getElementById('userDropdown');
            const logoutBtn = document.getElementById('logoutBtn');

            // 点击用户信息按钮切换下拉菜单
            userInfoBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                userDropdown.classList.toggle('show');
            });

            // 点击页面其他地方关闭下拉菜单
            document.addEventListener('click', function() {
                userDropdown.classList.remove('show');
            });

            // 退出登录
            logoutBtn.addEventListener('click', function() {
                if (confirm('确定要退出登录吗？')) {
                    // 清除所有登录信息
                    ['token', 'authToken', 'userData', 'username', 'userId'].forEach(key => {
                        localStorage.removeItem(key);
                    });
                    
                    // 刷新页面
                    window.location.reload();
                }
            });
        }

        // 获取用户数据
        function getUserData() {
            try {
                const userData = localStorage.getItem('userData');
                if (userData) {
                    return JSON.parse(userData);
                }
                
                // 如果没有完整用户数据，尝试从其他字段获取
                const username = localStorage.getItem('username');
                if (username) {
                    return { username: username };
                }
                
                return null;
            } catch (e) {
                console.warn('解析用户数据失败:', e);
                return null;
            }
        }

        // 加载任务列表
        async function loadTasks() {
            showLoading();
            try {
                // 使用正确的API调用方式
                const tasks = await makeRequest('/tasks', 'GET', null, false);
                allTasks = Array.isArray(tasks) ? tasks : [];
                displayTasks(allTasks);
                updateTaskStats(allTasks.length);
            } catch (error) {
                console.error('加载任务失败:', error);
                showError('网络错误，请稍后重试');
            } finally {
                hideLoading();
            }
        }

        // 显示任务列表
        function displayTasks(tasks) {
            const taskListContainer = document.getElementById('taskList');
            
            if (tasks.length === 0) {
                taskListContainer.style.display = 'none';
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('pagination').style.display = 'none';
                return;
            }

            taskListContainer.style.display = 'grid';
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('pagination').style.display = 'flex';

            taskListContainer.innerHTML = tasks.map(task => `
                <div class="task-card card hover-lift" onclick="window.location.href='detail.html?id=${task.id}'">
                    <div class="card-body">
                        <div class="task-header">
                            <span class="task-category">${task.category || '其他'}</span>
                            <span class="task-status ${task.status || 'open'}">${getStatusText(task.status)}</span>
                        </div>
                        
                        <h3 class="task-title">
                            <a href="detail.html?id=${task.id}">${task.title}</a>
                        </h3>
                        
                        <p class="task-description">${task.description}</p>
                        
                                                 <div class="task-meta">
                             <div class="task-budget">￥${task.reward || task.budget || 0}</div>
                             <div class="task-deadline">
                                 <i class="fas fa-clock"></i>
                                 ${formatDeadline(task.deadline)}
                             </div>
                         </div>
                        
                        <div class="task-footer">
                            <div class="task-publisher">
                                <i class="fas fa-user"></i>
                                ${task.publisher_name || '匿名用户'}
                            </div>
                            <div class="task-actions">
                                <a href="detail.html?id=${task.id}" class="btn btn-outline-primary btn-sm" onclick="event.stopPropagation()">
                                    查看详情
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 执行搜索
        function performSearch() {
            const searchTerm = document.getElementById('searchInput').value.trim();
            applyFilters(searchTerm);
        }

        // 应用筛选器
        function applyFilters(searchTerm = '') {
            const category = document.getElementById('categoryFilter').value;
            const budget = document.getElementById('budgetFilter').value;
            const status = document.getElementById('statusFilter').value;
            const sort = document.getElementById('sortFilter').value;

            let filteredTasks = [...allTasks];

            // 搜索过滤
            if (searchTerm) {
                filteredTasks = filteredTasks.filter(task => 
                    task.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    task.description.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }

            // 分类过滤
            if (category) {
                filteredTasks = filteredTasks.filter(task => task.category === category);
            }

                         // 预算过滤
             if (budget) {
                 filteredTasks = filteredTasks.filter(task => {
                     const taskBudget = parseFloat(task.reward || task.budget || 0);
                     switch (budget) {
                         case '0-500': return taskBudget < 500;
                         case '500-2000': return taskBudget >= 500 && taskBudget < 2000;
                         case '2000-5000': return taskBudget >= 2000 && taskBudget < 5000;
                         case '5000-10000': return taskBudget >= 5000 && taskBudget < 10000;
                         case '10000+': return taskBudget >= 10000;
                         default: return true;
                     }
                 });
             }

            // 状态过滤
            if (status) {
                filteredTasks = filteredTasks.filter(task => task.status === status);
            }

                         // 排序
             switch (sort) {
                 case 'budget_desc':
                     filteredTasks.sort((a, b) => parseFloat(b.reward || b.budget || 0) - parseFloat(a.reward || a.budget || 0));
                     break;
                 case 'budget_asc':
                     filteredTasks.sort((a, b) => parseFloat(a.reward || a.budget || 0) - parseFloat(b.reward || b.budget || 0));
                     break;
                 case 'deadline_asc':
                     filteredTasks.sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
                     break;
                 default:
                     filteredTasks.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
             }

            displayTasks(filteredTasks);
            updateTaskStats(filteredTasks.length);
        }

        // 重置筛选器
        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('categoryFilter').value = '';
            document.getElementById('budgetFilter').value = '';
            document.getElementById('statusFilter').value = '';
            document.getElementById('sortFilter').value = 'created_at_desc';
            
            displayTasks(allTasks);
            updateTaskStats(allTasks.length);
        }

        // 更新任务统计
        function updateTaskStats(count) {
            document.getElementById('total-tasks').textContent = count;
        }

        // 显示加载状态
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('taskList').style.display = 'none';
            document.getElementById('emptyState').style.display = 'none';
        }

        // 隐藏加载状态
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        // 获取状态文本
        function getStatusText(status) {
            switch (status) {
                case 'open': return '进行中';
                case 'completed': return '已完成';
                case 'cancelled': return '已取消';
                default: return '进行中';
            }
        }

        // 格式化截止时间
        function formatDeadline(deadline) {
            if (!deadline) return '无截止时间';
            
            const deadlineDate = new Date(deadline);
            const now = new Date();
            const diffTime = deadlineDate - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) return '已截止';
            if (diffDays === 0) return '今天截止';
            if (diffDays === 1) return '明天截止';
            if (diffDays <= 7) return `${diffDays}天后截止`;
            
            return deadlineDate.toLocaleDateString('zh-CN');
        }

        // 显示错误消息
        function showError(message) {
            console.error(message);
            // 这里可以添加错误提示UI
        }

        // 初始化好友功能
        function initializeFriendsWidget() {
            const token = localStorage.getItem('authToken') || localStorage.getItem('token');
            if (token) {
                window.friendsWidget = new NavbarFriendsWidget();
                setupFriendsDropdown();
            }
        }

        // 设置好友下拉菜单
        function setupFriendsDropdown() {
            const friendsDropdown = document.getElementById('friendsDropdown');
            const dropdownToggle = friendsDropdown ? friendsDropdown.querySelector('.dropdown-toggle') : null;
            const dropdownContent = document.getElementById('friendsDropdownContent');

            if (friendsDropdown && dropdownToggle && dropdownContent) {
                friendsDropdown.style.display = 'block';

                // 点击切换下拉菜单
                dropdownToggle.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    toggleFriendsDropdown();
                });

                // 点击页面其他地方关闭下拉菜单
                document.addEventListener('click', (e) => {
                    if (!friendsDropdown.contains(e.target)) {
                        closeFriendsDropdown();
                    }
                });

                // 防止下拉菜单内部点击关闭菜单
                dropdownContent.addEventListener('click', (e) => {
                    e.stopPropagation();
                });
            }
        }

        // 切换好友下拉菜单
        function toggleFriendsDropdown() {
            const dropdownToggle = document.querySelector('.dropdown-toggle');
            const dropdownContent = document.getElementById('friendsDropdownContent');
            
            if (dropdownContent && dropdownContent.classList.contains('show')) {
                closeFriendsDropdown();
            } else {
                openFriendsDropdown();
            }
        }

        // 打开好友下拉菜单
        function openFriendsDropdown() {
            const dropdownToggle = document.querySelector('.dropdown-toggle');
            const dropdownContent = document.getElementById('friendsDropdownContent');
            
            if (dropdownToggle) dropdownToggle.classList.add('active');
            if (dropdownContent) dropdownContent.classList.add('show');
            
            // 加载好友数据
            if (window.friendsWidget) {
                window.friendsWidget.loadAllData();
            }
        }

        // 关闭好友下拉菜单
        function closeFriendsDropdown() {
            const dropdownToggle = document.querySelector('.dropdown-toggle');
            const dropdownContent = document.getElementById('friendsDropdownContent');
            
            if (dropdownToggle) dropdownToggle.classList.remove('active');
            if (dropdownContent) dropdownContent.classList.remove('show');
        }

        // 导航栏好友功能组件
        class NavbarFriendsWidget {
            constructor() {
                this.setupEventListeners();
            }

            setupEventListeners() {
                // 搜索功能
                const searchBtn = document.getElementById('navSearchBtn');
                const searchInput = document.getElementById('navSearchInput');
                
                if (searchBtn) {
                    searchBtn.addEventListener('click', () => this.searchUsers());
                }
                
                if (searchInput) {
                    searchInput.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') {
                            this.searchUsers();
                        }
                    });
                }
            }

            // 加载所有数据
            async loadAllData() {
                try {
                    await Promise.all([
                        this.loadFriendRequests(),
                        this.loadFriends()
                    ]);
                } catch (error) {
                    console.error('加载好友数据失败:', error);
                }
            }

            // 搜索用户
            async searchUsers() {
                const searchInput = document.getElementById('navSearchInput');
                const resultsContainer = document.getElementById('navSearchResults');
                const query = searchInput ? searchInput.value.trim() : '';

                if (!query) {
                    if (resultsContainer) resultsContainer.innerHTML = '<div class="empty-message">请输入用户名</div>';
                    return;
                }

                if (resultsContainer) resultsContainer.innerHTML = '<div class="empty-message">搜索中...</div>';

                try {
                    const response = await this.makeRequest('/friends/search', 'POST', { query });
                    this.renderSearchResults(response.users || []);
                } catch (error) {
                    console.error('搜索用户失败:', error);
                    if (resultsContainer) resultsContainer.innerHTML = '<div class="empty-message">搜索失败</div>';
                }
            }

            // 渲染搜索结果
            renderSearchResults(users) {
                const container = document.getElementById('navSearchResults');
                if (!container) return;
                
                if (!users || users.length === 0) {
                    container.innerHTML = '<div class="empty-message">未找到用户</div>';
                    return;
                }

                container.innerHTML = users.slice(0, 3).map(user => `
                    <div class="user-item">
                        <div class="user-avatar-small">${user.username.charAt(0).toUpperCase()}</div>
                        <div class="user-info-small">
                            <div class="user-name-small">${this.escapeHtml(user.username)}</div>
                            <div class="user-level-small">等级: ${user.level || 1}</div>
                        </div>
                        <div class="user-action-small">
                            ${this.renderFriendshipAction(user)}
                        </div>
                    </div>
                `).join('');
            }

            // 渲染好友关系操作
            renderFriendshipAction(user) {
                switch (user.friendshipStatus) {
                    case 'accepted':
                        return '<span class="status-text-small">已是好友</span>';
                    case 'pending':
                        return '<span class="status-text-small">已申请</span>';
                    case 'rejected':
                        return `<button class="action-btn-small btn-add-small" onclick="window.friendsWidget.sendFriendRequest(${user.id})">重新申请</button>`;
                    default:
                        return `<button class="action-btn-small btn-add-small" onclick="window.friendsWidget.sendFriendRequest(${user.id})">添加</button>`;
                }
            }

            // 发送好友申请
            async sendFriendRequest(friendId) {
                try {
                    await this.makeRequest('/friends/request', 'POST', { friend_id: friendId });
                    this.showMessage('好友申请发送成功', 'success');
                    this.searchUsers(); // 重新搜索以更新状态
                } catch (error) {
                    console.error('发送好友申请失败:', error);
                    this.showMessage('发送好友申请失败', 'error');
                }
            }

            // 加载好友申请
            async loadFriendRequests() {
                try {
                    const response = await this.makeRequest('/friends/requests');
                    const requests = response.requests || [];
                    this.renderFriendRequests(requests);
                    this.updateRequestBadge(requests.length);
                } catch (error) {
                    console.error('加载好友申请失败:', error);
                    const container = document.getElementById('navFriendRequests');
                    if (container) container.innerHTML = '<div class="empty-message">加载失败</div>';
                }
            }

            // 渲染好友申请
            renderFriendRequests(requests) {
                const container = document.getElementById('navFriendRequests');
                if (!container) return;
                
                if (!requests || requests.length === 0) {
                    container.innerHTML = '<div class="empty-message">暂无好友申请</div>';
                    return;
                }

                container.innerHTML = requests.slice(0, 3).map(request => `
                    <div class="user-item">
                        <div class="user-avatar-small">${request.username.charAt(0).toUpperCase()}</div>
                        <div class="user-info-small">
                            <div class="user-name-small">${this.escapeHtml(request.username)}</div>
                            <div class="user-level-small">${this.formatDate(request.created_at)}</div>
                        </div>
                        <div class="user-action-small">
                            <button class="action-btn-small btn-accept-small" onclick="window.friendsWidget.respondToRequest(${request.id}, 'accept')">
                                <i class="fas fa-check"></i>
                            </button>
                            <button class="action-btn-small btn-reject-small" onclick="window.friendsWidget.respondToRequest(${request.id}, 'reject')">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            // 响应好友申请
            async respondToRequest(requestId, action) {
                try {
                    await this.makeRequest(`/friends/request/${requestId}`, 'POST', { action });
                    const actionText = action === 'accept' ? '接受' : '拒绝';
                    this.showMessage(`已${actionText}好友申请`, 'success');
                    this.loadFriendRequests();
                    if (action === 'accept') {
                        this.loadFriends();
                    }
                } catch (error) {
                    console.error('处理好友申请失败:', error);
                    this.showMessage('处理好友申请失败', 'error');
                }
            }

            // 加载好友列表
            async loadFriends() {
                try {
                    const response = await this.makeRequest('/friends');
                    const friends = response.friends || [];
                    this.renderFriends(friends);
                } catch (error) {
                    console.error('加载好友列表失败:', error);
                    const container = document.getElementById('navFriendsList');
                    if (container) container.innerHTML = '<div class="empty-message">加载失败</div>';
                }
            }

            // 渲染好友列表
            renderFriends(friends) {
                const container = document.getElementById('navFriendsList');
                if (!container) return;
                
                if (!friends || friends.length === 0) {
                    container.innerHTML = '<div class="empty-message">暂无好友</div>';
                    return;
                }

                container.innerHTML = friends.slice(0, 4).map(friend => `
                    <div class="user-item">
                        <div class="user-avatar-small">${friend.username.charAt(0).toUpperCase()}</div>
                        <div class="user-info-small">
                            <div class="user-name-small">${this.escapeHtml(friend.username)}</div>
                            <div class="user-level-small">等级: ${friend.level || 1}</div>
                        </div>
                        <div class="user-action-small">
                            <button class="action-btn-small btn-chat-small" onclick="window.friendsWidget.startChat(${friend.id})">
                                <i class="fas fa-comments"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            // 开始聊天
            startChat(friendId) {
                window.location.href = `chat.html?friend=${friendId}`;
            }

            // 更新申请数量徽章
            updateRequestBadge(count) {
                const navBadge = document.getElementById('friendRequestBadge');
                const countBadge = document.getElementById('requestCountBadge');
                
                if (count > 0) {
                    const displayCount = count > 99 ? '99+' : count.toString();
                    if (navBadge) {
                        navBadge.textContent = displayCount;
                        navBadge.style.display = 'flex';
                    }
                    if (countBadge) {
                        countBadge.textContent = displayCount;
                        countBadge.style.display = 'inline';
                    }
                } else {
                    if (navBadge) navBadge.style.display = 'none';
                    if (countBadge) countBadge.style.display = 'none';
                }
            }

            // API请求
            async makeRequest(endpoint, method = 'GET', body = null) {
                const API_BASE_URL = 'http://localhost:3000/api';
                const headers = {
                    'Content-Type': 'application/json'
                };

                const token = localStorage.getItem('authToken') || localStorage.getItem('token');
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }

                const config = {
                    method,
                    headers
                };

                if (body) {
                    config.body = JSON.stringify(body);
                }

                const response = await fetch(`${API_BASE_URL}${endpoint}`, config);
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ error: '请求失败' }));
                    throw new Error(errorData.error || '请求失败');
                }

                return await response.json();
            }

            // 显示消息提示
            showMessage(message, type = 'info') {
                const messageEl = document.createElement('div');
                messageEl.className = `navbar-message navbar-message-${type}`;
                messageEl.style.cssText = `
                    position: fixed;
                    top: 80px;
                    right: 20px;
                    background: ${type === 'success' ? '#238636' : type === 'error' ? '#da3633' : '#58a6ff'};
                    color: white;
                    padding: 8px 16px;
                    border-radius: 6px;
                    z-index: 10000;
                    font-size: 14px;
                    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
                    opacity: 0;
                    transform: translateX(100%);
                    transition: all 0.3s ease;
                `;
                messageEl.textContent = message;

                document.body.appendChild(messageEl);

                setTimeout(() => {
                    messageEl.style.opacity = '1';
                    messageEl.style.transform = 'translateX(0)';
                }, 10);

                setTimeout(() => {
                    messageEl.style.opacity = '0';
                    messageEl.style.transform = 'translateX(100%)';
                    setTimeout(() => document.body.removeChild(messageEl), 300);
                }, 2000);
            }

            // 格式化日期
            formatDate(dateString) {
                const date = new Date(dateString);
                const now = new Date();
                const diffTime = Math.abs(now - date);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays === 1) return '今天';
                if (diffDays <= 7) return `${diffDays}天前`;
                return date.toLocaleDateString('zh-CN');
            }

            // 转义HTML
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }
    </script>
</body>
</html>
