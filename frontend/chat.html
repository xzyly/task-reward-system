<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天 - TaskReward</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/common.css" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        .chat-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            height: calc(100vh - 140px);
            display: flex;
            gap: 20px;
        }

        /* 会话列表 */
        .conversation-list {
            width: 300px;
            background: rgba(13, 17, 23, 0.8);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .conversation-header {
            padding: 20px;
            border-bottom: 1px solid rgba(240, 246, 252, 0.1);
        }

        .conversation-header h3 {
            color: #f0f6fc;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .conversation-list-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .conversation-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 8px;
            position: relative;
        }

        .conversation-item:hover {
            background: rgba(240, 246, 252, 0.06);
        }

        .conversation-item.active {
            background: rgba(88, 166, 255, 0.1);
            border-left: 3px solid #58a6ff;
        }

        .conversation-user {
            color: #f0f6fc;
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .conversation-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .conversation-preview {
            color: #8b949e;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .conversation-time {
            color: #8b949e;
            font-size: 11px;
            position: absolute;
            top: 12px;
            right: 12px;
        }

        .unread-badge {
            background: #da3633;
            color: white;
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: bold;
            position: absolute;
            bottom: 12px;
            right: 12px;
        }

        /* 聊天区域 */
        .chat-area {
            flex: 1;
            background: rgba(13, 17, 23, 0.8);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid rgba(240, 246, 252, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .chat-header-info h3 {
            color: #f0f6fc;
            margin: 0;
        }

        .chat-header-info p {
            color: #8b949e;
            margin: 0;
            font-size: 13px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            position: relative;
            word-wrap: break-word;
        }

        .message.sent {
            align-self: flex-end;
            background: #58a6ff;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            align-self: flex-start;
            background: rgba(240, 246, 252, 0.1);
            color: #f0f6fc;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
        }

        .message.sent .message-time {
            text-align: right;
        }

        .message.received .message-time {
            text-align: left;
        }

        .chat-input {
            padding: 20px;
            border-top: 1px solid rgba(240, 246, 252, 0.1);
        }

        .input-group {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .message-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(240, 246, 252, 0.2);
            border-radius: 8px;
            background: rgba(240, 246, 252, 0.05);
            color: #f0f6fc;
            font-size: 14px;
            resize: none;
            min-height: 40px;
            max-height: 120px;
        }

        .message-input::placeholder {
            color: #8b949e;
        }

        .message-input:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
        }

        .send-btn {
            padding: 12px 20px;
            background: #58a6ff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            height: 40px;
        }

        .send-btn:hover:not(:disabled) {
            background: #79c0ff;
            transform: translateY(-1px);
        }

        .send-btn:disabled {
            background: #656d76;
            cursor: not-allowed;
            transform: none;
        }

        /* 空状态 */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #8b949e;
            text-align: center;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* 加载状态 */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #8b949e;
        }

        .loading i {
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .chat-container {
                flex-direction: column;
                height: calc(100vh - 100px);
                padding: 10px;
            }

            .conversation-list {
                width: 100%;
                height: 200px;
                margin-bottom: 10px;
            }

            .chat-area {
                height: calc(100vh - 320px);
            }

            .conversation-list-content {
                display: flex;
                gap: 10px;
                padding: 10px;
                overflow-x: auto;
                overflow-y: visible;
            }

            .conversation-item {
                min-width: 200px;
                margin-bottom: 0;
            }

            .message {
                max-width: 85%;
            }
        }

        /* 滚动条样式 */
        .conversation-list-content::-webkit-scrollbar,
        .chat-messages::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .conversation-list-content::-webkit-scrollbar-track,
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .conversation-list-content::-webkit-scrollbar-thumb,
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(240, 246, 252, 0.2);
            border-radius: 3px;
        }

        .conversation-list-content::-webkit-scrollbar-thumb:hover,
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: rgba(240, 246, 252, 0.3);
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <div id="navbar-placeholder"></div>

    <div class="chat-container">
        <!-- 会话列表 -->
        <div class="conversation-list">
            <div class="conversation-header">
                <h3><i class="fas fa-comments"></i> 聊天</h3>
            </div>
            <div class="conversation-list-content" id="conversationList">
                <div class="loading">
                    <i class="fas fa-spinner"></i>
                    加载中...
                </div>
            </div>
        </div>

        <!-- 聊天区域 -->
        <div class="chat-area">
            <div id="chatContent">
                <div class="empty-state">
                    <i class="fas fa-comments"></i>
                    <h3>选择一个好友开始聊天</h3>
                    <p>从左侧列表中选择一个好友，或者去好友页面添加新好友</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/chat.js"></script>
    <script>
        // 加载导航栏
        fetch('navbar.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('navbar-placeholder').innerHTML = html;
            })
            .catch(error => console.error('加载导航栏失败:', error));
    </script>
</body>
</html>
